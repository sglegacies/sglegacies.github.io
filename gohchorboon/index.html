<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LegaciesSG</title>
<meta name="description" content="LegaciesSG is set up for ordinary Singaporeans to pay tribute and express our respect, love and gratitude towards those who have touched and positively impacted our lives.">
<style>
  html, body { margin: 0; min-height: 100%; }
  body {
    background: linear-gradient(180deg, #f7f4ee 0%, #eef1ea 100%);
    color: #3b433f;
    font-family: 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, 'Times New Roman', serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .page { max-width: 720px; margin: 0 auto; padding: 56px 26px 72px; }
  h1 {
    font-size: clamp(1.6rem, 6vw, 2.2rem); font-weight: 500; letter-spacing: .015em;
    text-align: center; margin: 0 0 34px; color: #333b37;
  }
  figure { margin: 0 0 34px; }
  figure img {
    display: block; width: 100%; height: auto;
    border-radius: 18px; box-shadow: 0 18px 40px -18px rgba(59, 67, 63, .28);
  }
  footer {
    margin-top: 40px; padding-top: 20px; border-top: 1px solid #ddd6c8;
    text-align: center; font-size: .78rem; letter-spacing: .28em; text-transform: uppercase; color: #8b938c;
  }
  footer a { color: inherit; text-decoration: none; }
  @media (max-width: 480px) {
    .page { padding: 34px 20px 56px; }
    h1 { margin-bottom: 26px; }
  }
</style>
</head>
<body>
  <main class="page">
    <h1>LegaciesSG</h1>
    <figure><img src="photo-1.jpg" alt="A group of friends leaning on a railing at a running track"></figure>
    <figure><img src="photo-2.jpg" alt="Five people standing together on a running track"></figure>
    <figure><img src="photo-3.jpg" alt="A group of runners in singlets gathered near parked cars"></figure>
    <footer><a href="/">LegaciesSG</a></footer>
  </main>
</body>
</html>
